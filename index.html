<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUETAJON PUBG UC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080808;
  color: white;
}

header {
  text-align: center;
  padding: 25px 15px;
  background: #151515;
  border-bottom: 2px solid #ffb300;
}

header h1 {
  margin: 0;
  color: #ffb300;
  font-size: 29px;
}

header p {
  color: #ccc;
  font-size: 18px;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

h2 {
  text-align: center;
  color: #ffb300;
}

.id-box {
  background: #151515;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 17px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #444;
  background: #0d0d0d;
  color: white;
  font-size: 17px;
}

.packages {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.card {
  background: #151515;
  border: 1px solid #333;
  border-radius: 15px;
  padding: 18px 10px;
  text-align: center;
}

.uc {
  color: #ffb300;
  font-size: 22px;
  font-weight: bold;
}

.price {
  font-size: 18px;
  margin: 12px 0;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #ffb300;
  color: #111;
  font-size: 16px;
  font-weight: bold;
}

.info {
  margin-top: 25px;
  padding: 18px;
  background: #151515;
  border-radius: 15px;
  text-align: center;
  color: #bbb;
}

footer {
  text-align: center;
  color: #777;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <h1>🎮 SUETAJON PUBG UC</h1>
  <p>💎 Tezkor UC Shop</p>
</header>

<div class="container">

<h2>💎 UC Paketini tanlang</h2>

<div class="id-box">
  <label>PUBG ID raqamingiz:</label>

  <input
    type="number"
    id="playerId"
    placeholder="PUBG ID kiriting"
  >
</div>

<div class="packages">

<div class="card">
  <div class="uc">💎 60 UC</div>
  <div class="price">10 000 so'm</div>
  <button onclick="buyUC('60 UC','10 000 so‘m')">
    🛒 Sotib olish
  </button>
</div>

<div class="card">
  <div class="uc">💎 325 UC</div>
  <div class="price">50 000 so'm</div>
  <button onclick="buyUC('325 UC','50 000 so‘m')">
    🛒 Sotib olish
  </button>
</div>

<div class="card">
  <div class="uc">💎 660 UC</div>
  <div class="price">100 000 so'm</div>
  <button onclick="buyUC('660 UC','100 000 so‘m')">
    🛒 Sotib olish
  </button>
</div>

<div class="card">
  <div class="uc">💎 1800 UC</div>
  <div class="price">250 000 so'm</div>
  <button onclick="buyUC('1800 UC','250 000 so‘m')">
    🛒 Sotib olish
  </button>
</div>

</div>

<div class="info">
  📲 PUBG ID kiriting va kerakli UC paketini tanlang.
  <br><br>
  🔔 Buyurtmani Telegram orqali davom ettirasiz.
</div>

</div>

<footer>
© 2026 SUETAJON PUBG UC
</footer>

<script>

function buyUC(uc, price) {

  let id = document.getElementById("playerId").value.trim();

  if (id === "") {
    alert("❗ Avval PUBG ID raqamingizni kiriting!");
    return;
  }

  let order =
    "id_" + id +
    "_uc_" + uc.replace(" ", "") +
    "_price_" + price.replace(/\s/g, "");

  let telegramURL =
    "https://t.me/Bulldrop_club_bot?start=" +
    encodeURIComponent(order);

  window.open(telegramURL, "_blank");
}

</script>

</body>
  </html>
